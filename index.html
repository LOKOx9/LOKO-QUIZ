<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZ</title><link rel="stylesheet" href="style.css"></head><body>
<header><div id="logo">QUIZ</div><div id="topStats" class="hide"><span>النقاط <b id="score">0</b></span><span>السؤال <b id="cur">1</b>/<b id="tot">10</b></span></div></header>
<main>
<section id="home" class="screen active"><div class="hero"><small>QUIZ • CHOOSE YOUR CATEGORY</small><h1>اختر فئتك</h1><p>20 سؤالًا في كل فئة. اختر فئة وابدأ التحدي.</p><div id="cats" class="cats"></div></div></section>
<section id="quiz" class="screen"><div class="box"><div class="progress"><i id="bar"></i></div><div class="meta"><span id="catName"></span><span>⏱ <b id="time">15</b></span></div><h2 id="q"></h2><div id="answers"></div><button id="next" class="next hide">التالي →</button></div></section>
<section id="result" class="screen"><div class="result"><small>FINAL RESULT</small><h1 id="title">انتهى الاختبار</h1><div class="points"><b id="final">0</b><span>/ 100</span></div><p id="resultText"></p><button id="again" class="primary">إعادة الفئة</button><button id="back" class="secondary">اختيار فئة أخرى</button></div></section>
</main><footer>RED • BLACK • WHITE</footer><script src="config.js"></script><script src="script.js"></script></body></html>
